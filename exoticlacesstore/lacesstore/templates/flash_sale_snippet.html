<!-- flash_sale_snippet.html -->
{% if active_flash_sales %}
    <div class="flash-sale-banner mb-4">
        <div class="bg-danger text-white p-3 rounded">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h4><i class="fas fa-bolt"></i> Flash Sale!</h4>
                    {% for sale in active_flash_sales %}
                        <h5>{{ sale.title }}</h5>
                        <p>{{ sale.discount_percentage }}% OFF - {{ sale.product.name }}</p>
                    {% endfor %}
                </div>
                <div class="col-md-6 text-right">
                    <div class="countdown-timer" data-end="{{ sale.end_time|date:'Y-m-d H:i:s' }}">
                        <span class="badge badge-light p-2" id="countdown-display"></span>
                    </div>
                    <a href="{% url 'flash_sale_detail' sale.id %}" class="btn btn-warning mt-2">
                        Shop Now <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateCountdown() {
            const timerEl = document.getElementById('countdown-display');
            if (!timerEl) return;
            
            const endTime = new Date(timerEl.parentElement.dataset.end).getTime();
            const now = new Date().getTime();
            const diff = endTime - now;
            
            if (diff <= 0) {
                timerEl.textContent = 'Expired';
                return;
            }
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            timerEl.textContent = `${hours}h ${minutes}m ${seconds}s`;
        }
        
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
{% endif %}
